name: docker
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ vars.NAMESPACE || 'kubernetesloong64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        env:
          JAVA_VERSION: 21.0.11_10
          LOONGSON_JAVA_VERSION: 21.11.38-fx
        run: |
          TAG="${{ env.NAMESPACE }}/jenkins-loong64"
          echo "==> Building ${TAG}"
          docker buildx build \
            --no-cache \
            -f debian/Dockerfile \
            --platform linux/loong64 \
            --build-arg "DEBIAN_NAME=lcr.loongnix.cn/debian" \
            --build-arg "DEBIAN_RELEASE_LINE=forky" \
            --build-arg "DEBIAN_VERSION=slim" \
            --build-arg "DEBIAN_VARIANT=" \
            --build-arg "JAVA_VERSION=${{ env.JAVA_VERSION }}" \
            --build-arg "JDK_DOWNLOAD_URL=https://ftp.loongnix.cn/Java/openjdk21/loongson${{ env.LOONGSON_JAVA_VERSION }}-jdk${{ env.JAVA_VERSION }}-linux-loongarch64-glibc2.34.tar.gz" \
            -t "${TAG}" \
            .
          echo "==> Done: ${TAG}"
